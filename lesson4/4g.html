<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .subscribe-button
        {
            background-color: rgb(204,0,0);
            color: white;
            border: none;
            height: 40px;
            width: 140px;
            cursor: pointer;
            border-radius: 2px;
            vertical-align: top;
            margin-right:8px;
            margin-bottom: 20px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 10px;
            padding-bottom: 10px;
            transition: opacity 0.15s;

        }
        .subscribe-button:hover{
            background-color: rgb(100,0,0);
            color: blue;
        }

    </style>
    <button class="subscribe-button">subscribe</button>
</body>
</html>
